version: '3.9'

services:

  mysql:
    image: greenleaf-mysql:latest
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: greenleaf_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gardening_db
      MYSQL_USER: gardenuser
      MYSQL_PASSWORD: gardenpass

  backend:
    image: greenleaf-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenleaf_backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: gardenuser
      DB_PASSWORD: gardenpass
      DB_NAME: gardening_db

  frontend:
    image: greenleaf-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenleaf_frontend
    restart: unless-stopped
    ports:
      - "80:80"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: frontend
        image: 821263771829.dkr.ecr.eu-north-1.amazonaws.com/greenleaf-frontend:latest
        ports:
        - containerPort: 80

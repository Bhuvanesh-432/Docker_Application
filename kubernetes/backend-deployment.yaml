apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 821263771829.dkr.ecr.eu-north-1.amazonaws.com/greenleaf-backend:latest

        ports:
        - containerPort: 5000

        env:
        - name: DB_HOST
          value: mysql

        - name: DB_USER
          value: gardenuser

        - name: DB_PASSWORD
          value: gardenpass

        - name: DB_NAME
          value: gardening_db

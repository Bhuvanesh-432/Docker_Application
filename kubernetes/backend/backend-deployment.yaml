apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: greenleaf

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: <YOUR-ECR-URL>/greenleaf-backend:latest

        ports:
        - containerPort: 5000

        env:
        - name: DB_HOST
          value: mysql-service

        - name: DB_USER
          value: root

        - name: DB_PASSWORD
          value: root123

        - name: DB_NAME
          value: greenleafdb
